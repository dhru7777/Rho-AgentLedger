<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home · AgentLedger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css?v=rho2" />
</head>
<body class="rho-dash">
  <aside class="rho-side">
    <a class="rho-mark" href="/ledger">AgentLedger</a>
    <button type="button" class="rho-org" disabled>Shopping cohort</button>

    <nav class="rho-nav">
      <p class="rho-nav-label">Overview</p>
      <button type="button" class="rho-nav-btn active" data-go="home">Home</button>

      <p class="rho-nav-label">Banking</p>
      <button type="button" class="rho-nav-btn" data-go="banking">All activity</button>
      <button type="button" class="rho-nav-btn nest" data-go="banking-crypto">Crypto · USDC</button>
      <button type="button" class="rho-nav-btn nest" data-go="banking-fiat">Fiat · Stripe</button>
      <button type="button" class="rho-nav-btn nest" data-go="banking-rho">Rho settlements</button>

      <p class="rho-nav-label">Agents</p>
      <button type="button" class="rho-nav-btn" data-go="agents">Credit files</button>
      <button type="button" class="rho-nav-btn nest" data-go="agent-sales">Shopping</button>
      <button type="button" class="rho-nav-btn nest" data-go="agent-support">Support</button>
      <button type="button" class="rho-nav-btn nest" data-go="agent-research">Research</button>

      <p class="rho-nav-label">Identity</p>
      <button type="button" class="rho-nav-btn" data-go="identity">ERC-8004 character</button>
      <button type="button" class="rho-nav-btn nest" data-go="identity-buyer">Shopping Agent</button>
      <button type="button" class="rho-nav-btn nest" data-go="identity-seller">Merchant Agent</button>

      <p class="rho-nav-label">Workflows</p>
      <button type="button" class="rho-nav-btn" data-go="recon">Reconciliation</button>
    </nav>
  </aside>

  <div class="rho-main">
    <header class="rho-top">
      <div class="rho-top-left">
        <span class="rho-pill" id="rhoPill">rho · fixture</span>
        <span class="rho-pill" id="modePill">adapter</span>
      </div>
      <div class="rho-top-actions">
        <a class="rho-btn" href="/architecture">Architecture</a>
        <a class="rho-btn" href="/">Demo</a>
        <a class="rho-btn solid" href="/">Pay</a>
      </div>
    </header>

    <div class="rho-scroll">
      <section class="rho-pane" id="pane-home"></section>
      <section class="rho-pane" id="pane-banking" hidden></section>
      <section class="rho-pane" id="pane-agents" hidden></section>
      <section class="rho-pane" id="pane-identity" hidden></section>
      <section class="rho-pane" id="pane-recon" hidden></section>
    </div>
    <div class="rho-chat">
      <div class="rho-chat-log" id="chatLog"></div>
      <form class="rho-chat-form" id="chatForm">
        <input id="chatInput" autocomplete="off" placeholder="Ask the scoreboard — who should get more budget, what’s Shopping’s credit, any unmatched claims?" />
        <button type="submit">Ask</button>
      </form>
    </div>
  </div>

  <script src="/ledger.js?v=rho2"></script>
</body>
</html>
